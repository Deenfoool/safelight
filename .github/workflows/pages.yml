name: Deploy Safelight to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify autonomous runtime
        run: |
          test -f vendor/jszip.min.js
          test -f vendor/jspdf.umd.min.js
          test -f vendor/pdf.min.js
          test -f vendor/pdf.worker.min.js
          test -f css/local-fonts.css
          if grep -R -nE 'cdnjs\.cloudflare\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|unpkg\.com|cdn\.jsdelivr\.net' \
            --include='*.html' --include='*.js' --include='*.mjs' --include='*.css' \
            --exclude-dir='.git' --exclude-dir='.github' .; then
            echo 'Third-party runtime URL found.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
