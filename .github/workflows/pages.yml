name: Deploy Safelight to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download local browser libraries
        run: |
          mkdir -p vendor
          curl -L --fail --retry 3 -o vendor/jszip.min.js https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          curl -L --fail --retry 3 -o vendor/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js
          curl -L --fail --retry 3 -o vendor/pdf.min.mjs https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs
          curl -L --fail --retry 3 -o vendor/pdf.worker.min.mjs https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs

      - name: Rewrite third-party PDF/ZIP URLs to local assets
        run: |
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 sed -i \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#./vendor/jszip.min.js#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js#./vendor/jspdf.umd.min.js#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs#./vendor/pdf.min.mjs#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs#./vendor/pdf.worker.min.mjs#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js#./vendor/pdf.worker.min.mjs#g'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
